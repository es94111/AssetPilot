name: E2E / Visual / Accessibility

# issue #264：補齊 E2E、視覺回歸與無障礙測試防護網。
# 使用獨立的 PostgreSQL service container 作為測試資料庫，所有測試資料皆由
# tests/e2e/support 的 fixtures 以程式建立／清除（見 tests/e2e/README.md），
# 不使用、亦不需要任何正式環境帳密或第三方 OAuth 憑證。

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/e2e/**"
      - "tests/lib/*Ledger*.test.ts"
      - "tests/lib/ledgerPolicy.test.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://assetpilot:assetpilot@localhost:5432/assetpilot_e2e
  JWT_SECRET: e2e-ci-jwt-secret-not-for-production-use-0123456789
  API_TOKEN_ENCRYPTION_KEY: e2e-ci-api-token-encryption-key-0123456789
  PORT: "3000"

jobs:
  e2e:
    name: E2E / a11y / visual
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetpilot_e2e
          POSTGRES_USER: assetpilot
          POSTGRES_PASSWORD: assetpilot
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U assetpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run shared-ledger authorization and PostgreSQL integration tests
        run: npm run test:ledger-policy && npm run test:shared-ledger && npm run test:shared-ledger-clients

      - name: Run E2E, accessibility, and visual regression tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces/videos on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  update-visual-snapshots:
    name: Update visual snapshots (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetpilot_e2e
          POSTGRES_USER: assetpilot
          POSTGRES_PASSWORD: assetpilot
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U assetpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 此 job 不會自動提交變更（避免未經檢視的畫面直接進 main）。
      # 下載 artifact 後請人工檢視每張截圖，確認無異狀再提交到
      # tests/e2e/**/*-snapshots/。
      - name: Generate baseline snapshots
        run: npx playwright test tests/e2e/visual.test.ts --update-snapshots=all
        env:
          CI: "true"

      - name: Upload generated snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-snapshots
          path: tests/e2e/**/*-snapshots/**
          retention-days: 14
