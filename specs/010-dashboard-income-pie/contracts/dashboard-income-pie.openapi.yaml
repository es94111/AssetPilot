openapi: 3.2.0
info:
  title: 儀表板收入分類圓餅圖 — 契約片段
  version: 1.0.0
  description: >
    本檔案記錄 010-dashboard-income-pie 功能對 GET /api/dashboard 端點的變更。
    完整契約定義於專案根目錄 openapi.yaml，本檔為差異說明文件。

paths:
  /api/dashboard:
    get:
      summary: 儀表板資料彙整（010 新增 incomeCatBreakdown 欄位）
      operationId: getDashboard
      parameters:
        - in: query
          name: yearMonth
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: YYYY-MM 格式，未提供時 fallback 為當月
      responses:
        '200':
          description: >
            儀表板彙整資料。010 新增 incomeCatBreakdown 欄位（CategoryAggregateNode[]），
            結構與 catBreakdown（支出分類）完全相同，資料來源為 type='income' 交易。
          content:
            application/json:
              schema:
                type: object
                properties:
                  yearMonth:
                    type: string
                    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                  income:
                    type: number
                  expense:
                    type: number
                  net:
                    type: number
                  todayExpense:
                    type: number
                  catBreakdown:
                    type: array
                    description: 支出分類彙整（既有，不變）
                    items:
                      $ref: '#/components/schemas/CategoryAggregateNode'
                  incomeCatBreakdown:
                    type: array
                    description: 收入分類彙整（010 新增）；結構與 catBreakdown 相同，資料為當月收入交易
                    items:
                      $ref: '#/components/schemas/CategoryAggregateNode'
                  recent:
                    type: array
                    description: 最近 5 筆交易（既有，不變）
                    items:
                      type: object

components:
  schemas:
    CategoryAggregateNode:
      type: object
      description: 分類聚合節點，由 buildCategoryAggregateNodes() 產生
      properties:
        categoryId:
          type: ['string', 'null']
          description: 子分類 ID；null 表示虛擬「（其他）」節點
        name:
          type: string
          description: 子分類名稱
        color:
          type: string
          description: 子分類顏色（hex）
        parentId:
          type: string
          description: 父分類 ID
        parentName:
          type: string
          description: 父分類名稱
        parentColor:
          type: string
          description: 父分類顏色（hex）
        total:
          type: number
          description: 當月金額合計
        isOtherGroup:
          type: boolean
          description: 是否為虛擬「（其他）」節點（FR-013）
