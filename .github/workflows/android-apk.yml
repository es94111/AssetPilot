name: Build Android App Bundle

# Builds a signed release App Bundle (.aab) for Google Play Console and
# publishes it to Google Play internal testing on version tags or manual runs,
# and to S3-compatible storage. Version follows the same `vX.Y.Z` tag that
# docker-publish.yml auto-creates from changelog.json on a push to main.
# (APK output was dropped — Play distributes the .aab and the in-app APK update
# flow was removed in 4.50.0.)
on:
  # 只在版本 tag 或手動/被 docker-publish 觸發的 workflow_dispatch 上跑。
  # 不再掛 push:main，避免每次 main 推送都白建一份 .aab（Play 上傳本來就被 gate
  # 在 tag/dispatch）。docker-publish 建好新 tag 後會以 workflow_dispatch 觸發本流程。
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 最小權限：本流程只 checkout 程式碼，上傳 .aab／Play／S3 都走 secrets 而非
# GITHUB_TOKEN，因此只需讀取 contents 即可。
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      # Gates for steps (secrets can't be read directly in `if`).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      SHOULD_UPLOAD_PLAY: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .currentVersion changelog.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: ${VERSION}"

      - name: Generate Google Play release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p mobile/build/play-whatsnew
          node <<'NODE'
          const fs = require('fs');
          const changelog = JSON.parse(fs.readFileSync('changelog.json', 'utf8'));
          const version = process.env.VERSION;
          const release = (changelog.releases || []).find((r) => String(r.version) === version)
            || (changelog.releases || []).find((r) => String(r.version) === String(changelog.currentVersion))
            || (changelog.releases || [])[0];

          const lines = [];
          if (release?.title) lines.push(String(release.title));
          for (const change of release?.changes || []) {
            const text = String(change?.text || '').trim();
            if (text) lines.push(`・${text}`);
          }
          let notes = (lines.length ? lines.join('\n') : `AssetPilot ${version} 版本更新`).trim();
          if (notes.length > 500) notes = notes.slice(0, 497).replace(/[\s\n。；，,;:：]+$/u, '') + '...';
          for (const locale of ['zh-TW', 'en-US']) {
            fs.writeFileSync(`mobile/build/play-whatsnew/whatsnew-${locale}`, notes + '\n');
          }
          console.log(notes);
          NODE

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify Google Play upload configuration
        if: ${{ env.SHOULD_UPLOAD_PLAY == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON secret; cannot upload AAB to Google Play Console."
            missing=1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret; Google Play requires a release-signed AAB, not the debug fallback."
            missing=1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret."
            missing=1
          fi
          if [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo "::error::Missing ANDROID_KEY_ALIAS secret."
            missing=1
          fi
          if [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "::error::Missing ANDROID_KEY_PASSWORD secret."
            missing=1
          fi
          exit "$missing"

      # Decode the fixed release keystore from secrets so every build is signed
      # with the same key (stable upload key for Google Play). When the secret
      # is absent the build falls back to the debug key (see
      # android/app/build.gradle.kts), so forks/PRs still build.
      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # App Bundle (.aab) for Google Play Console uploads. Signed with the
      # release key (key.properties written above) when the keystore secret is
      # present, otherwise the debug key. Uploaded as a workflow artifact for
      # manual upload to Play, and also published to S3 (versioned + latest).
      # 只打包 ARM ABI（arm64-v8a / armeabi-v7a）。所有真實 Android 裝置都是 ARM；
      # x86_64 只會被 Google Play 審查/Pre-Launch 的 x86_64 模擬器抓去，而 Sentry
      # 原生層（NDK 崩潰處理 / Session Replay 的 MediaCodec 編碼）在那類模擬器上會
      # SIGABRT（見 Sentry issue ASSETPILOT-APP-1）。排除 x86_64 後審查改用 ARM
      # 模擬器即不再誤報，AAB 體積也更小，對真實使用者零影響。
      - name: Build release App Bundle (AAB)
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --target-platform android-arm,android-arm64
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assetpilot-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      # Upload the .aab to Google Play Console and assign it to BOTH the internal
      # testing and closed testing (alpha) tracks in a single edit, then commit
      # (closed track is sent for review automatically).
      # Runs on version tags (vX.Y.Z) and manual workflow_dispatch runs.
      # Routine pushes to main still only build/upload artifacts and S3.
      # Requires:
      #   - PLAY_SERVICE_ACCOUNT_JSON secret: full JSON key of a Google Play
      #     service account with "Release to testing tracks" permission.
      #   - The app already created on Play Console with at least one manual
      #     upload (Google requires the first AAB via the Console UI).
      #   - A signed (non-debug) build, i.e. the release keystore secret set.
      - name: Publish to Google Play (internal + alpha, auto-submit)
        if: ${{ env.SHOULD_UPLOAD_PLAY == 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.assetpilot.assetpilot
          AAB_PATH: ${{ github.workspace }}/mobile/build/app/outputs/bundle/release/app-release.aab
          WHATSNEW_DIR: ${{ github.workspace }}/mobile/build/play-whatsnew
          TRACKS: internal,alpha
          # 此 runner 連 googleapis 時 IPv6 路徑會在回應傳完前中斷
          # （ERR_STREAM_PREMATURE_CLOSE / "Premature close"），重試無效。
          # 強制 DNS 先回 IPv4，讓 OAuth token 與上傳走可用的 IPv4 路徑。
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -euo pipefail
          # 此腳本僅用 Node 內建模組（fetch/crypto），不需安裝任何相依套件。
          sa_json="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$sa_json"
          SA_JSON_PATH="$sa_json" node "$GITHUB_WORKSPACE/.github/scripts/play-publish.mjs"

      - name: Publish AAB + version manifest to S3
        if: ${{ env.S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          AAB_PATH: mobile/build/app/outputs/bundle/release/app-release.aab
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
          ENDPOINT="${S3_ENDPOINT:-https://s3.${REGION}.s4.mega.io}"

          # 前置檢查：上傳前先確認 bucket 存在，避免 misconfigured S3_BUCKET
          # 讓 aws s3 cp 拋出難讀的 NoSuchBucket。
          if ! aws s3 ls "s3://${S3_BUCKET}" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "::error::S3 bucket 不存在或無法存取（region=${REGION}）。"
            echo "::error::請確認 S3_BUCKET 是真實 bucket 名稱，S3_REGION 與 S3_ENDPOINT 對應該 bucket 所在區域。"
            exit 1
          fi

          AAB_KEY="downloads/assetpilot-v${VERSION}.aab"
          AAB_URL="${ENDPOINT%/}/${S3_BUCKET}/${AAB_KEY}"

          # Versioned + stable "latest" copies of the App Bundle (.aab).
          aws s3 cp "$AAB_PATH" "s3://${S3_BUCKET}/${AAB_KEY}" --endpoint-url "$ENDPOINT"
          aws s3 cp "$AAB_PATH" "s3://${S3_BUCKET}/downloads/assetpilot-latest.aab" --endpoint-url "$ENDPOINT"

          # Manifest read by /api/app/version (App Bundle only).
          cat > app-version.json <<EOF
          {
            "version": "${VERSION}",
            "aabUrl": "${AAB_URL}",
            "aabFile": "assetpilot-v${VERSION}.aab",
            "buildNumber": ${{ github.run_number }},
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          aws s3 cp app-version.json "s3://${S3_BUCKET}/downloads/app-version.json" \
            --content-type application/json --endpoint-url "$ENDPOINT"

          echo "Published $AAB_URL"
