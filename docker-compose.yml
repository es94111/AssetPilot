services:
  assetpilot:
    image: es94111/assetpilot:latest
    # 如果要自行建置，取消下一行註解並註解 image:
    # build: .
    container_name: assetpilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - assetpilot-data:/app/data
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DB_PATH=/app/data/database.db
      - ENV_PATH=/app/data/.env
      - SSL_PATH=/app/data/SSL
      - JWT_EXPIRES=7d
      - GOOGLE_CLIENT_ID=
      # JWT_SECRET 與 DB_ENCRYPTION_KEY 首次啟動自動產生並寫入 /app/data/.env

# 具名 Volume — Docker 自動管理，資料不會因容器刪除而遺失
volumes:
  assetpilot-data:
    driver: local
