name: Update dependencies to latest

on:
  push:
    branches:
      - chore/update-dependencies-20260817
    paths:
      - .github/workflows/update-latest-dependencies-20260817.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/update-dependencies-20260817
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          check-latest: true
      - name: Upgrade Node.js dependencies
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name package.json -not -path '*/node_modules/*' -print -quit | grep -q .; then
            npx --yes npm-check-updates@latest --deep --upgrade --target latest
            while IFS= read -r -d '' lock; do
              dir="$(dirname "$lock")"
              (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            done < <(find . -type f -name package-lock.json -not -path '*/node_modules/*' -print0)
          fi
      - name: Upgrade Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name Cargo.toml -print -quit | grep -q .; then
            rustup update stable
            rustup default stable
            cargo install cargo-edit --locked
            while IFS= read -r -d '' manifest; do cargo upgrade --manifest-path "$manifest" --incompatible allow --pinned allow; done < <(find . -type f -name Cargo.toml -print0)
            while IFS= read -r -d '' lock; do manifest="$(dirname "$lock")/Cargo.toml"; [ ! -f "$manifest" ] || cargo update --manifest-path "$manifest"; done < <(find . -type f -name Cargo.lock -print0)
          fi
      - name: Upgrade Flutter and Dart dependencies
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name pubspec.yaml -print -quit | grep -q .; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
            flutter config --no-analytics
            flutter --version
            while IFS= read -r -d '' pubspec; do dir="$(dirname "$pubspec")"; (cd "$dir" && flutter pub upgrade --major-versions); done < <(find . -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print0)
          fi
      - name: Commit dependency updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No dependency updates were required."; exit 0; fi
          git commit -m "chore(deps): update dependencies to latest versions"
          git push origin HEAD:chore/update-dependencies-20260817
