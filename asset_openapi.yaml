      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 狀態已切換

  /api/recurring/process:
    post:
      operationId: processRecurring
      tags: [Recurring]
      summary: 手動執行固定收支（產生到期交易）
      responses:
        "200":
          description: 執行結果

  # ── 儀表板 / 報表 ─────────────────────
  /api/dashboard:
    get:
      operationId: getDashboard
      tags: [Dashboard]
      summary: 取得儀表板資料
      responses:
        "200":
          description: 儀表板統計資料

  /api/reports:
    get:
      operationId: getReports
      tags: [Dashboard]
      summary: 取得統計報表
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 報表資料

