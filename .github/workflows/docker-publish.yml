name: Build & Push Docker Image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE_NAME: assetpilot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write   # 允許用 gh workflow run 觸發 android-apk 的 workflow_dispatch

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Read version from changelog.json
        id: ver
        run: echo "version=$(jq -r .currentVersion changelog.json)" >> $GITHUB_OUTPUT

      - name: Create git tag if missing
        id: tag
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # 以「遠端」是否已存在該 tag 為準（CI checkout 預設不會抓 tag，用本地
          # git rev-parse 會誤判為不存在，接著 push 撞上遠端既有 tag 而失敗）。
          # 若改版流程中已手動打過 vX.Y.Z（/update-docs 步驟），這裡會正確略過。
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on remote, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "v$VERSION"
            # 容忍極端競態（同時有人剛推上同名 tag）：被拒時不讓整個工作流程失敗。
            if git push origin "v$VERSION"; then
              echo "created=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v$VERSION push rejected (already on remote), continuing"
              echo "created=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # 用 GITHUB_TOKEN push 出去的 tag 不會觸發其他 workflow（GitHub 防遞迴規則），
      # 所以這裡顯式以 workflow_dispatch 觸發 android-apk 去建置並上傳 .aab 到 Google Play。
      # workflow_dispatch 是 GITHUB_TOKEN 能觸發的少數例外，毋需額外 PAT。
      # android-apk 在 dispatch 時會自 changelog.json 讀出同一版本號。
      - name: Trigger Android build & Play upload for new tag
        if: github.ref == 'refs/heads/main' && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Dispatching android-apk.yml for v$VERSION on main"
          gh workflow run android-apk.yml --ref main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # ── Docker Hub 登入（主要；偶發網路逾時 → 重試 3 次）──
      - name: Login to Docker Hub (with retry)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              ok=1; break
            fi
            echo "Docker Hub 登入第 $i 次失敗，$((i * 5))s 後重試..."; sleep $((i * 5))
          done
          [ "$ok" = 1 ] || { echo "::error::Docker Hub 登入連續 3 次失敗"; exit 1; }

      # ── GitHub Container Registry 登入（備用；重試 3 次，失敗不中斷整個工作流）──
      - name: Login to GitHub Container Registry (with retry)
        id: ghcr_login
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3; do
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              ok=1; break
            fi
            echo "ghcr.io 登入第 $i 次失敗，$((i * 5))s 後重試..."; sleep $((i * 5))
          done
          [ "$ok" = 1 ] || { echo "::warning::ghcr.io 登入連續 3 次失敗，將略過 ghcr 推送"; exit 1; }

      # ── 標籤：Docker Hub ──
      - name: Docker metadata (Docker Hub)
        id: meta_dockerhub
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev.${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # ── 標籤：ghcr ──
      - name: Docker metadata (ghcr)
        id: meta_ghcr
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev.${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # ── 建置 & 推送：Docker Hub（主要，必須成功；同時把 layer cache 寫入 gha）──
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          build-args: |
            APK_UPGRADE_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 建置 & 推送：ghcr（備用；僅在 ghcr 登入成功時執行，且失敗不中斷）──
      # 重用上一步寫入的 gha cache，實際不會重新編譯，只是把同一份 image 推到 ghcr。
      - name: Build and push to ghcr
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          build-args: |
            APK_UPGRADE_CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha

      # ── GitHub Release（內文自 changelog.json 產生；已存在就略過）──
      # 刻意排在推送映像檔之後：Release 一出現就代表該版本的 image 已經可以拉取。
      # 不綁在「這次執行有建 tag」上，tag 由 /update-docs 手動推的情況也會補上
      # Release（過去正是這樣漏掉好幾版）。main 與 tag 兩種觸發都會嘗試，先跑完的
      # 那個建立，另一個會在下面的存在性檢查略過。
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # tag 觸發時以 tag 名為準（可能是補打舊版），main 觸發時用 changelog 版號。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            TAG="v$VERSION"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::$TAG 不在遠端（tag 建立可能失敗），略過建立 Release"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          TITLE="$(NOTES_FILE="$NOTES_FILE" node .github/scripts/release-notes.mjs)"
          echo "Creating release $TAG: $TITLE"
          if gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"; then
            echo "Created release $TAG"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            # 競態：另一次執行剛好搶先建立，視為成功。
            echo "Release $TAG was created concurrently, continuing"
          else
            echo "::error::建立 Release $TAG 失敗"
            exit 1
          fi
