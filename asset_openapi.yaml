        "200":
          description: 固定收支陣列
    post:
      operationId: createRecurring
      tags: [Recurring]
      summary: 新增固定收支
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInput'
      responses:
        "200":
          description: 新增成功

  /api/recurring/{id}:
    put:
      operationId: updateRecurring
      tags: [Recurring]
      summary: 更新固定收支
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
