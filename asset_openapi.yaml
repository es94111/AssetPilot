      operationId: createStock
      tags: [Stocks]
      summary: 新增股票
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockInput'
      responses:
        "200":
          description: 新增成功

  /api/stocks/{id}:
    put:
      operationId: updateStock
      tags: [Stocks]
      summary: 更新股票基本資料
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol:
                  type: string
                name:
                  type: string
                stockType:
                  type: string
                  enum: [stock, etf, warrant]
      responses:
        "200":
          description: 更新成功
    delete:
      operationId: deleteStock
      tags: [Stocks]
      summary: 刪除股票
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功

  /api/stocks/batch-price:
    post:
      operationId: batchUpdateStockPrice
      tags: [Stocks]
      summary: 批次更新股票現價
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbols]
              properties:
                symbols:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 更新結果

  /api/stocks/cleanup:
    post:
      operationId: cleanupStocks
      tags: [Stocks]
      summary: 清除無持倉且無交易紀錄的股票
      responses:
        "200":
          description: 清除結果

  # ── 股票交易紀錄 ──────────────────────
  /api/stock-transactions:
    get:
      operationId: getStockTransactions
      tags: [StockTransactions]
      summary: 取得股票交易紀錄（支援篩選分頁）
      parameters:
        - name: stockId
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: 交易紀錄清單
    post:
      operationId: createStockTransaction
      tags: [StockTransactions]
      summary: 新增股票買賣交易
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockTransactionInput'
      responses:
        "200":
          description: 新增成功

  /api/stock-transactions/{id}:
    put:
      operationId: updateStockTransaction
      tags: [StockTransactions]
      summary: 更新股票交易
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stockId:
                  type: string
                date:
                  type: string
                type:
                  type: string
                  enum: [buy, sell]
                shares:
                  type: number
                price:
                  type: number
                fee:
                  type: number
