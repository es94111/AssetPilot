name: Build Android APK

# Builds a signed release APK and publishes it to S3-compatible storage so
# the app/web can offer in-app (OTA) updates. Version follows the same
# `vX.Y.Z` tag that docker-publish.yml auto-creates from changelog.json on a
# push to main.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      # Gate for the signing step (secrets can't be read directly in `if`).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .currentVersion changelog.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: ${VERSION}"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # Decode the fixed release keystore from secrets so every build is signed
      # with the same key (stable SHA-1 for cross-version OTA updates). When the
      # secret is absent the build falls back to the debug key (see
      # android/app/build.gradle.kts), so forks/PRs still build.
      - name: Configure release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: mobile
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      # App Bundle (.aab) for Google Play Console uploads. Signed with the same
      # release key as the APK (key.properties written above). Uploaded as a
      # workflow artifact for manual upload to Play — unlike the APK it is not
      # published to S3/OTA.
      - name: Build release App Bundle (AAB)
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: assetpilot-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab

      # Fallback when S3 isn't configured — APK is normally distributed via
      # S3 below. Forks/PRs without S3 secrets still get an artifact.
      - name: Upload APK artifact
        if: ${{ env.S3_BUCKET == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: assetpilot-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK + version manifest to S3
        if: ${{ env.S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          APK_PATH: mobile/build/app/outputs/flutter-apk/app-release.apk
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          REGION="${AWS_DEFAULT_REGION:-eu-central-1}"
          ENDPOINT="${S3_ENDPOINT:-https://s3.${REGION}.s4.mega.io}"

          # 前置檢查：上傳前先確認 bucket 存在，避免 misconfigured S3_BUCKET
          # 讓 aws s3 cp 拋出難讀的 NoSuchBucket。
          if ! aws s3 ls "s3://${S3_BUCKET}" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "::error::S3 bucket 不存在或無法存取（region=${REGION}）。"
            echo "::error::請確認 S3_BUCKET 是真實 bucket 名稱，S3_REGION 與 S3_ENDPOINT 對應該 bucket 所在區域。"
            exit 1
          fi

          APK_KEY="downloads/assetpilot-v${VERSION}.apk"
          APK_URL="${ENDPOINT%/}/${S3_BUCKET}/${APK_KEY}"

          # Versioned + stable "latest" copies of the APK.
          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/${APK_KEY}" --endpoint-url "$ENDPOINT"
          aws s3 cp "$APK_PATH" "s3://${S3_BUCKET}/downloads/assetpilot-latest.apk" --endpoint-url "$ENDPOINT"

          # Manifest read by /api/app/version for the in-app update prompt.
          cat > app-version.json <<EOF
          {
            "version": "${VERSION}",
            "apkUrl": "${APK_URL}",
            "apkFile": "assetpilot-v${VERSION}.apk",
            "buildNumber": ${{ github.run_number }},
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          aws s3 cp app-version.json "s3://${S3_BUCKET}/downloads/app-version.json" \
            --content-type application/json --endpoint-url "$ENDPOINT"

          echo "Published $APK_URL"
