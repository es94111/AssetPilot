  # ── MCP 寫入權限（新增資料／更新備註，003-mcp-write-no-delete ＋ 004-mcp-update-notes-only） ──────────
  /api/user/mcp-credentials/{id}:
    patch:
      operationId: setMcpCredentialPermissions
      tags: [McpCredentials]
      summary: 開啟或關閉指定 PAT 憑證的 MCP 寫入權限（新增資料／更新備註）
      description: |
        變更即時生效於後續 MCP 連線，不影響此憑證先前已成功建立的交易或已更新的備註。
        兩種權限彼此獨立，可分別開關；未於 body 提供的權限維持原狀。
        僅能操作使用者本人名下的憑證，找不到時回傳 404。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpCredentialPermissionUpdate'
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    $ref: '#/components/schemas/McpCredential'
        "400":
          description: 請求格式錯誤（未提供任何權限欄位，或欄位非布林值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 找不到此憑證
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/mcp-oauth-connections:
    get:
      operationId: listMcpOAuthConnections
      tags: [McpOAuthConnections]
      summary: 列出使用者目前已連接的 AI 工具（依 OAuth client 分組）
      description: |
        每一列代表使用者目前仍持有有效授權的 AI 工具（以 client_id 為單位）——判定為「存在至少
        一項未撤銷且未過期的 token」。授權被撤銷或全數過期者不會出現在此清單；其權限設定仍保留在
        伺服器端，但日後重新授權時會重置為關閉。清單本身獨立於 access/refresh token 的核發與輪替週期。
      responses:
        "200":
          description: 已連接的 AI 工具清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpOAuthConnection'

  /api/user/mcp-oauth-connections/{clientId}:
    patch:
      operationId: setMcpOAuthConnectionPermissions
      tags: [McpOAuthConnections]
      summary: 開啟或關閉指定已連接 AI 工具的 MCP 寫入權限（新增資料／更新備註）
      description: |
        變更立即生效，不需使用者重新走一次 OAuth 授權流程。兩種權限彼此獨立，可分別開關；
        未於 body 提供的權限維持原狀。僅能操作使用者本人名下的連線，找不到時回傳 404。
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpOAuthConnectionPermissionUpdate'
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection:
                    $ref: '#/components/schemas/McpOAuthConnection'
        "400":
          description: 請求格式錯誤（未提供任何權限欄位，或欄位非布林值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: 找不到此連線
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

