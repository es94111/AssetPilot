openapi: "3.2.0"

info:
  title: AssetPilot API
  version: "4.103.0"
  description: |
    個人資產管理平台 AssetPilot 的完整 API Schema。
    供 Cloudflare API Shield Schema Validation 使用。
    認證方式：JWT 儲存於 httpOnly Cookie（token），除 /api/auth/* 與 /api/config 外均需認證。

servers:
  - url: https://asset.shao.one
    description: Production

# ─────────────────────────────────────────
# 標籤定義（對應 Cloudflare API Shield Endpoint Labels）
# ─────────────────────────────────────────
tags:
  - name: Config
    description: 系統設定與版本資訊（cf-web-page）
  - name: Auth
    description: 使用者登入驗證（cf-log-in）
  - name: Registration
    description: 使用者註冊（cf-sign-up）
  - name: Account
    description: 帳號設定與個人資料（cf-account-update）
  - name: Categories
    description: 分類管理（cf-content）
  - name: ExchangeRates
    description: 匯率設定與查詢（cf-content）
  - name: Accounts
    description: 帳戶管理（cf-content）
  - name: Transactions
    description: 交易記錄（cf-content）
  - name: Budgets
    description: 預算管理（cf-content）
  - name: Recurring
    description: 固定收支（cf-content）
  - name: Dashboard
    description: 儀表板與報表（cf-content）
  - name: TWSE
    description: 台灣證交所查詢（cf-content）
  - name: Stocks
    description: 股票管理（cf-content）
  - name: StockTransactions
    description: 股票交易紀錄（cf-content）
  - name: StockDividends
    description: 股利紀錄（cf-content）
  - name: StockRealized
    description: 實現損益（cf-content）
  - name: StockSettings
    description: 股票參數設定（cf-content）
  - name: StockRecurring
    description: 股票定期定額（cf-content）
  - name: McpCredentials
    description: MCP 個人化存取權杖（PAT）管理（cf-account-update）
  - name: McpOAuthConnections
    description: 已連接 AI 工具（OAuth）清單與新增資料權限管理（cf-account-update）

# ─────────────────────────────────────────
# 安全性定義
# ─────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:
    # ── 通用 ──
    IdObject:
      type: object
      properties:
        id:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # ── 分類 ──
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        color:
          type: string
        parentId:
          type: string
        isHidden:
          type: boolean
        sortOrder:
          type: integer

    CategoryInput:
      type: object
      required: [name, type, color]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        color:
          type: string
        parentId:
          type: string
        sortOrder:
          type: integer

    # ── 帳戶 ──
    Account:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        currency:
          type: string
        accountType:
          type: string
        excludeFromTotal:
          type: boolean
        balance:
          type: number
        initialBalance:
          type: number
        linkedBankId:
          type: string

    AccountInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        initialBalance:
          type: number
        icon:
          type: string
        currency:
          type: string
        accountType:
          type: string
        excludeFromTotal:
          type: boolean
        linkedBankId:
          type: string

    # ── 交易 ──
    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [income, expense, transfer_in, transfer_out]
        amount:
          type: number
        originalAmount:
          type: number
        currency:
          type: string
        fxRate:
          type: number
        date:
          type: string
          format: date
        categoryId:
          type: string
        accountId:
          type: string
        note:
          type: string
        excludeFromStats:
          type: boolean

    TransactionInput:
      type: object
      required: [type, amount, date, categoryId, accountId]
      properties:
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        originalAmount:
          type: number
        currency:
          type: string
        fxRate:
          type: number
        date:
          type: string
        categoryId:
          type: string
        accountId:
          type: string
        note:
          type: string
        excludeFromStats:
          type: boolean
        fxFee:
          type: number
          description: 海外刷卡手續費（TWD）

    # ── 預算 ──
    BudgetInput:
      type: object
      required: [amount, yearMonth]
      properties:
        categoryId:
          type: string
        amount:
          type: number
        yearMonth:
          type: string

    # ── 固定收支 ──
    RecurringInput:
      type: object
      required: [type, amount, categoryId, accountId, frequency, startDate]
      properties:
        type:
          type: string
          enum: [income, expense]
        amount:
          type: number
        currency:
          type: string
        fxRate:
          type: number
        categoryId:
          type: string
        accountId:
          type: string
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        startDate:
          type: string
        note:
          type: string

    # ── 匯率 ──
    ExchangeRateItem:
      type: object
      required: [currency, rateToTwd]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        rateToTwd:
          type: number

    # ── 股票 ──
    StockInput:
      type: object
      required: [symbol, name]
      properties:
        symbol:
          type: string
        name:
          type: string
        stockType:
          type: string
          enum: [stock, etf, warrant]

    StockTransactionInput:
      type: object
      required: [stockId, date, type, shares, price]
      properties:
        stockId:
          type: string
        date:
          type: string
        type:
          type: string
          enum: [buy, sell]
        shares:
          type: number
        price:
          type: number
        fee:
          type: number
        tax:
          type: number
        accountId:
          type: string
        note:
          type: string

    StockDividendInput:
      type: object
      required: [stockId, date]
      properties:
        stockId:
          type: string
        date:
          type: string
        cashDividend:
          type: number
        stockDividendShares:
          type: number
        accountId:
          type: string
        note:
          type: string

    # ── 管理員 ──
    AdminUserInput:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean

    BatchIdsInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string

    # ── MCP 新增資料權限（003-mcp-write-no-delete） ──
    McpCredential:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        allowCreate:
          type: boolean
          description: 是否允許此憑證透過 MCP 新增交易；預設 false。
        allowUpdateNote:
          type: boolean
          description: |
            是否允許此憑證透過 MCP 更新既有交易的備註；預設 false。
            與 allowCreate 彼此獨立，開啟其中一項不代表取得另一項的能力。
            本功能上線當下所有既有憑證（含 allowCreate 為 true 者）皆為 false。
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          # OpenAPI 3.1 起對齊 JSON Schema 2020-12，3.0 的 `nullable: true` 已移除，
          # 可空型別一律寫成型別陣列。
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
      required: [id, name, status, allowCreate, allowUpdateNote, createdAt]

    # 既有 McpCredentialAllowCreateUpdate 更名而來：本 body 現可攜帶兩種權限，
    # 原名稱已不再貼切（見 research.md 第 11 節）。屬性名稱與端點路徑皆不變。
    McpCredentialPermissionUpdate:
      type: object
      description: |
        兩個屬性皆為選填，但至少必須提供其中一個布林值；兩者皆未提供或型別非布林時回傳 400。
        僅提供其中一項時，另一項維持原狀不變。
      properties:
        allowCreate:
          type: boolean
          description: 新的「允許新增資料」狀態。
        allowUpdateNote:
          type: boolean
          description: 新的「允許更新備註」狀態。

    McpOAuthConnection:
      type: object
      properties:
        clientId:
          type: string
          description: 已授權的 OAuth client id（一個 AI 工具對應一個 client_id）。
        clientName:
          type: string
          description: 授權當下記錄的 client 顯示名稱快照。
        allowCreate:
          type: boolean
          description: 是否允許此連線透過 MCP 新增交易；預設 false。
        allowUpdateNote:
          type: boolean
          description: |
            是否允許此連線透過 MCP 更新既有交易的備註；預設 false。
            與 allowCreate 彼此獨立。此 AI 工具的授權全數失效後重新完成授權時，
            本欄位會與 allowCreate 一同重置為 false，須使用者再次主動開啟。
        firstConnectedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
      required: [clientId, clientName, allowCreate, allowUpdateNote, firstConnectedAt, lastUsedAt]

    # 既有 McpOAuthConnectionAllowCreateUpdate 更名而來，理由同上。
    McpOAuthConnectionPermissionUpdate:
      type: object
      description: |
        兩個屬性皆為選填，但至少必須提供其中一個布林值；兩者皆未提供或型別非布林時回傳 400。
        僅提供其中一項時，另一項維持原狀不變。
      properties:
        allowCreate:
          type: boolean
        allowUpdateNote:
          type: boolean

    # ── 006 信用卡總金額還款 ──
    RepaymentRequest:
      type: object
      description: |
        totalAmount 與 repayments 至少擇一；兩者同時出現時以 totalAmount 為準（FR-019）。
      properties:
        fromAccountId:
          type: string
          description: 付款帳戶 id，不可為信用卡帳戶（FR-010）
        date:
          type: [string, 'null']
          description: 還款日期 YYYY-MM-DD；省略或無法解析時以使用者時區的今日為準（FR-014）
        totalAmount:
          type: integer
          minimum: 1
          description: 本次還款總金額（付款帳戶幣別），須為大於 0 的整數且不得小於納入卡片張數（FR-008、FR-008a）
        repayments:
          type: array
          description: 舊版行動 App 逐張卡片金額（過渡相容路徑）；系統加總為一筆總金額後套用自動納入與等比例分配重算（FR-019a）
          items:
            type: object
            properties:
              cardId:
                type: string
              amount:
                type: number
      required: [fromAccountId]

    RepaymentAllocation:
      type: object
      properties:
        cardId:
          type: string
        cardName:
          type: string
        cardCurrency:
          type: string
        amount:
          type: integer
          minimum: 1
        amountInCardCurrency:
          type: number
        balanceAfter:
          type: number
          description: 還款後該卡餘額；大於 0 代表預繳（FR-004、FR-020）
      required: [cardId, cardName, cardCurrency, amount, amountInCardCurrency, balanceAfter]

    RepaymentResponse:
      type: object
      properties:
        ok:
          type: boolean
        summaryId:
          type: string
        date:
          type: string
        fromAccountId:
          type: string
        currency:
          type: string
        totalAmount:
          type: integer
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/RepaymentAllocation'
      required: [ok, summaryId, date, fromAccountId, currency, totalAmount, allocations]

    PayableCard:
      type: object
      description: 本次納入還款的信用卡；陣列順序即標準順序，前端不得重排。
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
        debt:
          type: integer
          minimum: 1
        debtInCardCurrency:
          type: number
      required: [id, name, currency, debt, debtInCardCurrency]

    RepaymentCardsResponse:
      type: object
      properties:
        fromAccount:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            currency:
              type: string
          required: [id, name, currency]
        cards:
          type: array
          items:
            $ref: '#/components/schemas/PayableCard'
        totalDebt:
          type: integer
        minTotalAmount:
          type: integer
        snapshotAt:
          type: string
          format: date-time
      required: [fromAccount, cards, totalDebt, minTotalAmount, snapshotAt]

    SummaryAllocation:
      type: object
      properties:
        cardId:
          type: string
        cardName:
          type: string
        cardCurrency:
          type: string
        amount:
          type: integer
        amountInCardCurrency:
          type: number
        status:
          type: string
          enum: [intact, modified, deleted]
      required: [cardId, cardName, cardCurrency, amount, amountInCardCurrency, status]

    RepaymentSummaryResponse:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        fromAccount:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            currency:
              type: string
          required: [id, name, currency]
        totalAmount:
          type: integer
        inputMode:
          type: string
          enum: [total, legacy_items]
        createdAt:
          type: string
          format: date-time
        stale:
          type: boolean
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/SummaryAllocation'
      required: [id, date, fromAccount, totalAmount, inputMode, createdAt, stale, allocations]

# ─────────────────────────────────────────
# 預設安全性（全域）
# ─────────────────────────────────────────
security:
  - cookieAuth: []

# ─────────────────────────────────────────
# 路由定義
# ─────────────────────────────────────────
paths:

  # ── 公開頁面 ──────────────────────────
  /api/config:
    get:
      operationId: getConfig
      tags: [Config]
      summary: 取得前端設定（Google Client ID 等）
      security: []
      responses:
        "200":
          description: 設定物件

  /api/changelog:
    get:
      operationId: getChangelog
      tags: [Config]
      summary: 取得版本更新紀錄
      security: []
      responses:
        "200":
          description: Changelog JSON

  # ── 認證 ──────────────────────────────
  /api/auth/register:
    post:
      operationId: authRegister
      tags: [Registration]
      summary: 註冊新使用者
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                displayName:
                  type: string
      responses:
        "200":
          description: 註冊成功
        "400":
          description: 參數錯誤

  /api/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: 以電子郵件密碼登入
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: 登入成功，設定 httpOnly Cookie
        "401":
          description: 帳密錯誤
        "429":
          description: 登入失敗次數過多

  /api/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: 登出（清除 Cookie）
      security: []
      responses:
        "200":
          description: 登出成功

  /api/auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: 取得目前登入的使用者資訊
      responses:
        "200":
          description: 使用者資訊
        "401":
          description: 未認證

  /api/auth/google/state:
    get:
      operationId: authGoogleState
      tags: [Auth]
      summary: 取得 Google OAuth state nonce
      security: []
      responses:
        "200":
          description: State token

  /api/auth/google:
    post:
      operationId: authGoogle
      tags: [Auth]
      summary: Google SSO 登入 / 註冊
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                state:
                  type: string
      responses:
        "200":
          description: SSO 登入成功
        "401":
          description: Token 驗證失敗

  # ── Passkey (WebAuthn) 認證 ─────────────
  /api/auth/passkey/challenge:
    get:
      operationId: getPasskeyChallenge
      tags: [Auth]
      summary: 取得 Passkey 登入用 challenge
      security: []
      responses:
        "200":
          description: 回傳 challenge 與 key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  challenge:
                    type: string

  /api/auth/passkey/login:
    post:
      operationId: passkeyLogin
      tags: [Auth]
      summary: 使用 Passkey 進行無密碼登入
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authentication, challengeKey]
              properties:
                authentication:
                  type: object
                  description: WebAuthn authentication response
                challengeKey:
                  type: string
      responses:
        "200":
          description: 登入成功
        "400":
          description: Challenge 過期或缺少資料
        "401":
          description: Passkey 驗證失敗

  # ── 帳號設定 ──────────────────────────
  /api/account/login-logs:
    get:
      operationId: getLoginLogs
      tags: [Account]
      summary: 取得目前使用者的登入紀錄
      responses:
        "200":
          description: 登入紀錄清單

  /api/account/theme:
    put:
      operationId: updateTheme
      tags: [Account]
      summary: 更新使用者佈景主題
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                  enum: [light, dark, auto]
      responses:
        "200":
          description: 更新成功

  /api/account/display-name:
    put:
      operationId: updateDisplayName
      tags: [Account]
      summary: 更新顯示名稱
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        "200":
          description: 更新成功

  /api/account/link-google:
    post:
      operationId: linkGoogle
      tags: [Account]
      summary: 綁定 Google 帳號
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        "200":
          description: 綁定成功

  /api/account/unlink-google:
    post:
      operationId: unlinkGoogle
      tags: [Account]
      summary: 解除綁定 Google 帳號
      responses:
        "200":
          description: 解除成功

  /api/account/delete:
    post:
      operationId: deleteAccount
      tags: [Account]
      summary: 永久刪除帳號及所有資料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 帳號已刪除

  /api/account/password:
    put:
      operationId: updateAccountPassword
      tags: [Account]
      summary: 修改本機登入密碼（已有密碼者需驗證舊密碼；Google-only 帳號可新增本機密碼）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  description: 已設定密碼者必填
                newPassword:
                  type: string
                  minLength: 8
                  description: 至少 8 字元，需包含大寫字母、小寫字母、數字與特殊符號
      responses:
        "200":
          description: 密碼已更新
        "400":
          description: 參數錯誤（密碼太短、未含必要字元、與舊密碼相同等）
        "401":
          description: 目前密碼錯誤
        "404":
          description: 使用者不存在

  /api/account/passkey/challenge:
    get:
      operationId: getPasskeyRegisterChallenge
      tags: [Account]
      summary: 取得 Passkey 註冊用 challenge（需登入）
      responses:
        "200":
          description: 回傳 challenge 與 key

  /api/account/passkeys:
    get:
      operationId: listPasskeys
      tags: [Account]
      summary: 列出已註冊的 Passkey 清單
      responses:
        "200":
          description: Passkey 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        deviceName:
                          type: string
                        createdAt:
                          type: string

  /api/account/passkey/register:
    post:
      operationId: registerPasskey
      tags: [Account]
      summary: 註冊新的 Passkey 憑證
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration, challengeKey]
              properties:
                registration:
                  type: object
                  description: WebAuthn registration response
                challengeKey:
                  type: string
                deviceName:
                  type: string
      responses:
        "200":
          description: 註冊成功
        "400":
          description: Challenge 過期或驗證失敗

  /api/account/passkey/{id}:
    delete:
      operationId: deletePasskey
      tags: [Account]
      summary: 刪除已註冊的 Passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功
        "404":
          description: 找不到此 Passkey
    put:
      operationId: renamePasskey
      tags: [Account]
      summary: 重新命名 Passkey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceName]
              properties:
                deviceName:
                  type: string
      responses:
        "200":
          description: 更新成功
        "404":
          description: 找不到此 Passkey

  # ── 分類 ──────────────────────────────
  /api/categories:
    get:
      operationId: getCategories
      tags: [Categories]
      summary: 取得分類清單
      responses:
        "200":
          description: 分類陣列
    post:
      operationId: createCategory
      tags: [Categories]
      summary: 新增分類
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        "200":
          description: 新增成功

  /api/categories/{id}:
    put:
      operationId: updateCategory
      tags: [Categories]
      summary: 更新分類
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
                isHidden:
                  type: boolean
                sortOrder:
                  type: integer
      responses:
        "200":
          description: 更新成功
        "404":
          description: 分類不存在
    delete:
      operationId: deleteCategory
      tags: [Categories]
      summary: 刪除分類
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功

  # ── 匯率 ──────────────────────────────
  /api/exchange-rates:
    get:
      operationId: getExchangeRates
      tags: [ExchangeRates]
      summary: 取得使用者匯率設定
      responses:
        "200":
          description: 匯率清單與設定
    put:
      operationId: setExchangeRates
      tags: [ExchangeRates]
      summary: 手動儲存匯率（僅寫入本使用者）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rates]
              properties:
                rates:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExchangeRateItem'
      responses:
        "200":
          description: 儲存成功

  /api/exchange-rates/settings:
    put:
      operationId: updateExchangeRateSettings
      tags: [ExchangeRates]
      summary: 更新匯率自動更新設定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autoUpdate]
              properties:
                autoUpdate:
                  type: boolean
      responses:
        "200":
          description: 設定已更新

  /api/exchange-rates/refresh:
    post:
      operationId: refreshExchangeRates
      tags: [ExchangeRates]
      summary: 從外部 API 自動取得最新匯率
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                currencies:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 更新成功

  # ── 帳戶管理 ──────────────────────────
  /api/accounts:
    get:
      operationId: getAccounts
      tags: [Accounts]
      summary: 取得帳戶清單（含餘額）
      responses:
        "200":
          description: 帳戶陣列
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: 新增帳戶
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        "200":
          description: 新增成功

  /api/accounts/{id}:
    put:
      operationId: updateAccount
      tags: [Accounts]
      summary: 更新帳戶
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                initialBalance:
                  type: number
                icon:
                  type: string
                currency:
                  type: string
                accountType:
                  type: string
                excludeFromTotal:
                  type: boolean
                linkedBankId:
                  type: string
      responses:
        "200":
          description: 更新成功
    delete:
      operationId: deleteAccountEntry
      tags: [Accounts]
      summary: 刪除帳戶
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功

  /api/accounts/credit-card-repayment:
    post:
      operationId: creditCardRepayment
      tags: [Accounts]
      summary: 信用卡還款（輸入單一總金額，系統依欠款等比例分配到各張卡）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentRequest'
      responses:
        "200":
          description: 還款成功，回傳本次實際寫入的分配結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentResponse'
        "400":
          description: 參數錯誤（InvalidTotalAmount／TotalAmountTooSmall／NoPayableCards）
        "500":
          description: 寫入失敗，本次全部未寫入（已回滾）

  /api/accounts/{id}/repayment-cards:
    get:
      operationId: getRepaymentCards
      tags: [Accounts]
      summary: 取得以此帳戶為付款來源時本次納入還款的信用卡欠款快照
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 快照取得成功；cards 為空陣列代表本次無可還款卡片
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentCardsResponse'
        "400":
          description: 付款帳戶為信用卡（NotCreditCardPayer）
        "404":
          description: 帳戶不存在或不屬於本人

  /api/credit-card-repayment-summaries/{id}:
    get:
      operationId: getCreditCardRepaymentSummary
      tags: [Accounts]
      summary: 取得某次信用卡還款的分配摘要（含「已與現況不符」判定）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 摘要取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentSummaryResponse'
        "404":
          description: 摘要不存在或不屬於本人

  # ── 交易記錄 ──────────────────────────
  /api/transactions:
    get:
      operationId: getTransactions
      tags: [Transactions]
      summary: 取得交易記錄（支援篩選分頁）
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
        - name: keyword
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: |
            交易清單（含分頁資訊）。每筆交易含唯讀衍生欄位 repaymentSummaryId
            （非還款交易為空字串；非空代表該筆屬於某次信用卡還款摘要，可作為開啟摘要的入口）。
    post:
      operationId: createTransaction
      tags: [Transactions]
      summary: 新增交易
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        "200":
          description: 新增成功

  /api/transactions/{id}:
    put:
      operationId: updateTransaction
      tags: [Transactions]
      summary: 更新交易
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [income, expense]
                amount:
                  type: number
                originalAmount:
                  type: number
                currency:
                  type: string
                fxRate:
                  type: number
                date:
                  type: string
                categoryId:
                  type: string
                accountId:
                  type: string
                note:
                  type: string
                excludeFromStats:
                  type: boolean
      responses:
        "200":
          description: 更新成功
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: 刪除單筆交易
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功

  /api/transactions/{id}/restore-ai-created:
    post:
      operationId: restoreAiCreatedTransaction
      tags: [Transactions]
      summary: 還原（移除）一筆由 AI 透過 MCP 建立的交易
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已還原（交易與其連動對象皆已移除）
        "404":
          description: 找不到此交易，或不屬於目前使用者
        "409":
          description: 此交易並非 AI／MCP 建立（NotRestorable），未變更任何資料

  /api/transactions/{id}/restore-ai-note:
    get:
      operationId: previewAiNoteRestore
      tags: [Transactions]
      summary: 預覽「備註經 AI 修改」還原後的內容（唯讀）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 預覽內容
        "404":
          description: 找不到此交易，或不屬於目前使用者
    post:
      operationId: restoreAiNote
      tags: [Transactions]
      summary: 確認執行備註還原
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedUpdatedAt]
              properties:
                expectedUpdatedAt:
                  type: integer
      responses:
        "200":
          description: 已還原
        "400":
          description: 缺少或格式錯誤的 expectedUpdatedAt
        "404":
          description: 找不到此交易，或不屬於目前使用者
        "409":
          description: NoteChanged（樂觀鎖衝突）或 NotRestorable（無可還原快照），皆不變更任何資料

  /api/transactions/transfer:
    post:
      operationId: createTransfer
      tags: [Transactions]
      summary: 帳戶間轉帳
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromId, toId, amount, date]
              properties:
                fromId:
                  type: string
                toId:
                  type: string
                amount:
                  type: number
                date:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: 轉帳成功

  /api/transactions/batch-delete:
    post:
      operationId: batchDeleteTransactions
      tags: [Transactions]
      summary: 批次刪除交易
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdsInput'
      responses:
        "200":
          description: 刪除成功

  /api/transactions/batch-update:
    post:
      operationId: batchUpdateTransactions
      tags: [Transactions]
      summary: 批次更新交易（分類 / 帳戶 / 日期）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, fields]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                fields:
                  type: object
                  properties:
                    categoryId:
                      type: string
                    accountId:
                      type: string
                    date:
                      type: string
      responses:
        "200":
          description: 更新成功

  /api/transactions/import:
    post:
      operationId: importTransactions
      tags: [Transactions]
      summary: CSV 匯入交易記錄
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                      type:
                        type: string
                      amount:
                        type: string
                      category:
                        type: string
                      account:
                        type: string
                      note:
                        type: string
      responses:
        "200":
          description: 匯入成功

  # ── 預算 ──────────────────────────────
  /api/budgets:
    get:
      operationId: getBudgets
      tags: [Budgets]
      summary: 取得預算清單（含月份使用量）
      parameters:
        - name: yearMonth
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 預算清單
    post:
      operationId: createBudget
      tags: [Budgets]
      summary: 新增 / 更新預算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      responses:
        "200":
          description: 儲存成功

  /api/budgets/{id}:
    delete:
      operationId: deleteBudget
      tags: [Budgets]
      summary: 刪除預算
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 刪除成功

  # ── 固定收支 ──────────────────────────
  /api/recurring:
    get:
      operationId: getRecurring
